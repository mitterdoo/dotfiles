<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

	<alias>
		<family>sans-serif</family>
		<prefer><family>Archivo SemiCondensed</family></prefer>
		<!-- <prefer><family>Bio Sans</family></prefer> -->
	</alias>
	<alias>
		<family>monospace</family>
		<!-- <prefer><family>Iosevka Fixed</family></prefer> -->
		<!-- <prefer><family>SF Mono</family></prefer> -->
		<!-- <prefer><family>JetBrains Mono NL</family></prefer> -->
		<!-- <prefer><family>Recursive Monospace</family></prefer> -->
		<prefer>
			<family>TX-02</family>
		</prefer>
	</alias>

	<!--
	<match target="pattern">
		<test name="family"><string>TX-02</string></test>
		<edit name="width" mode="assign" binding="strong">
			<const>semicondensed</const>
		</edit>

	</match>
	-->

	<match target="font">
		<test name="family" compare="eq" ignore-blanks="true">
			<string>TX-02</string>
		</test>
		<edit name="fontfeatures" mode="append">
			<string>calt off</string>
		</edit>
	</match>

</fontconfig>
